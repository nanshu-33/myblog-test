<!--这是html的基础格式-->
<!DOCTYPE html>    <!--这是固定格式，版本是HTML5-->
<html lang="zh-CN"> <!-- 页面语言设置为中文,一般都网页要加，保证中文语法读取--> 
    <!--zh-CN简体中文-->     
    <!--页面根标签，表示从这里开始是HTML代码-->
<head>      <!--头部：这里的内容不会显示在网页的“正文区域”-->
    <meta charset="UTF-8">   <!--字符编码，支持中文，需要放在最前面防止乱码-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--这行代码是适应缩放的，一般都要加入-->
    <title>标题</title>      <!--标签页（页面最上端的部分）显示的文字-->
</head>   <!--头部结束-->
<body>    <!--身体，用户可见内容-->
    <!--用户可见的内容-->
    <h1>这是标题</h1>   <!--表示标题，有1-6号，1最大6最小-->
    <p>这是一段文字</p>
    <a href="链接">文字</a>
    <br>  <!--换行，让链接和图片分离开-->
    <img src="图片地址">   <!--插入图片，src后面是图片地址-->
    <div>   <!--表示分组，可以放链接也可以放别的-->
        <a>放链接，可以跳转</a>
    </div>
    <img src="图片地址" alt="图片不显示时显示的字">      <!--这样用div包裹也可以达到换行效果-->
    <ul>
        <li>项目1</li>
        <li>项目2</li>
    </ul>              <!--无序列表，每个 <li> 独占一行，
        前面自动添加一个 实心圆点作为项目符号：
        • 项目1
        • 项目2    像这样-->
    <ol>
        <li>项目1</li>
        <li>项目2</li>   
    </ol>             <!--有序列表：1.项目1
                                   2.项目2-->
    <div>这里的内容会占满一整行</div>
    <span>这里的内容只会占文字本身的宽度，它可以修改一段文字中的某些细节，
        部分变色或者加粗，在正文中嵌套使用</span>  
    
<!--页眉-->
    <header>
        <h1>我的博客</h1>   
        <nav>     <!--nav里的内容都是导航内容，跳转，只放跳转内容-->
            <a href="#">首页</a>
            <a href="#">文章</a>
            <a href="#">关于</a>
        </nav>
    </header>
    <!--网页中的主要内容，一个页面只能有一个这个-->
    <main>
        <article>   <!--表示接下来是文章内容-->
            <h2>文章1</h2>
            <p>发布时间：<time datetime="2026-07-19">这里的字就可以更自由的写</time></p>  
            <!--time里的是浏览器读到的时间-->
            <p>这是第一段话</p>
            <p>这是第二段话</p>
            <p>这是第<mark>三</mark>段话</p>   <!--mark里的内容会高亮-->
            <figure>   <!--表示接下来是图片内容-->
                <img src="C:\Users\JXM\Pictures\1.png" alt="示例">
                <figcaption>这是图注</figcaption>
            </figure>
            <section>
                <h3>章节一</h3>
            </section>
            <section>
                <h3>章节二</h3>
            </section>
        </article>
        <aside>  <!--侧边栏-->
            <h3>作者简介</h3>
            <p>这是一行简介</p>
        </aside>
    </main>
    <!--页脚内容-->
    <footer>
        <p>留下一行页脚的内容</p>
    </footer>
</body>
</html>
