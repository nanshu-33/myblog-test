<!--这是css的选择器基础内容-->
<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <link rel="stylesheet" href="style.css">   
    </head>
    <body>
        <div class="box">  <!--规定了box后需要调用类名才能实现，使用div包裹-->
            <p>这段文字是紫色的，20像素的字号</p>
            <h1>这个标题是蓝绿色的，15像素的字号</h1>
            <div>
                <a href="#">链接1div会占满整行</a>
            </div>
            <div>
                <a href="#">链接2这部分背景是灰色的</a>
            </div>
            <!--上面的内容是基础的标签选择器，按照标签名改变样式-->

            <!--类选择器-->
            <p class="type_1">这段会被类选择器中的内容改变样式</p>
            <p>这段还是会依照基础的标签选择器</p>
            <h1 class="type_1">这段也会被类选择题改变</h1>
            <!--class类名可以自己起，在css中用.类名来写样式-->

            <!--ID选择器-->
            <p id="type_2">这段文字会被ID选择器中的内容改变样式，
                一个ID在一个页面只能出现一次，优先级比类选择器高
                用来定位特殊元素
            </p>
            <!--在css中使用#id名来写样式-->

            <!--通配符选择器-->
            <!--在css中用* 来写样式，
            通常用来重置所有元素的默认样式（清除浏览器自带的间距）-->
        </div>
    </body>
</html>
