<!--这是css的三种基础写法演示-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 2. 内部样式 -->
    <style>
        p {
            color: blue;
            font-size: 20px;
        }
        h1 {
            font-size: 20px;
        }
    </style>

    <!-- 3. 外部样式 -->
    <link rel="stylesheet" href="style.css">  
    <!--如果注释这行，内部样式会执行
    如果交换次序，也会执行更后面的内容，即覆盖-->

</head>
<body>

    <!-- 1. 内联样式（优先级最高，所以是红色）不会因为外部或内部而改变-->
    <p style="color: red; font-size: 20px;">这段文字是红色的，内联格式</p>

    <!-- 2. 内部样式，在这段代码中，因为head中外部样式在内部后面定义，
     所以下面的内是外部的样式，内部的内容被覆盖了-->
    <p>这段话是蓝色的，20像素的字号，内部样式</p>
    <h1>这个标题字号是20像素（来自内部样式）</h1>

    <!-- 3. 外部样式，执行的是css文件中的格式-->
    <p>这段文字是紫色的，20像素的字号</p>
    <h1>这个标题是蓝绿色的，15像素的字号</h1>
    <!--内部和外部是谁写在后面，谁说了算-->

</body>
</html>
