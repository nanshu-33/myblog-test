<!--测试子元素-->
<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <link rel="stylesheet" href="style_3.css">
    </head>
    <body>
        <div class="container">
            <div class="item a">1</div>   <!--这里的item a 是两个类，
            后面主要是因为这些按钮既有共同属性也有不同，这样会比较方便，也可以只写一个类-->
            <div class="item b">2</div>
            <div class="item c">3</div>
            <div class="item d">4</div>
            <div class="item e">5</div>
            <div class="item f">6</div>    <!--这里的内容是套在container里面的，
            所以是子元素，而css里针对子元素写的.container .item 的内容也只对嵌套里的内容起作用-->
        </div>
        <!--因为有display: flex;弹性布局，所以123会横向排列，
        123之间间距20，不包括两侧，居中-->
    </body>
</html>
