{% extends "base.html" %}

{% block title %}编辑文章{% endblock %}

{% block content %}
<div class="new-post-form">
    <h2>编辑文章</h2>
    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" required>
        </div>
        <div class="form-group">
                <label for="category">分类</label>
                <select id="category" name="category">
                    <option value="新闻热点" {% if post.category == '新闻热点' %}selected{% endif %}>新闻热点</option>
                    <option value="杂谈" {% if post.category == '杂谈' %}selected{% endif %}>杂谈</option>
                    <option value="学习笔记" {% if post.category == '学习笔记' %}selected{% endif %}>学习笔记</option>
                    <option value="未分类"{% if not post.category or post.category == '未分类' %}selected{% endif %}>未分类</option>
                </select>
        </div>
        <div class="form-group">
            <label for="content">内容</label>
            <textarea id="content" name="content" rows="10" required>{{ post.content }}</textarea>
        </div>
        <div class="form-actions">
            <a href="javascript:history.back()" class="btn btn-back">← 返回文章</a>
            <button type="submit" class="btn btn-submit">更新文章</button> 
        </div>
    </form>
</div>
{% endblock %}
